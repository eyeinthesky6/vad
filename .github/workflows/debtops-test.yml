name: DebtOps Tests

on:
  push:
    paths:
      - 'debtops/**'
      - '.github/workflows/debtops-test.yml'
  pull_request:
    paths:
      - 'debtops/**'
      - '.github/workflows/debtops-test.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm test
        working-directory: debtops
